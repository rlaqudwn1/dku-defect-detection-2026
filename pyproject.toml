[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "defectlab"
version = "0.1.0"
description = "Lightweight local image-defect research and reproducibility tools"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
data = ["numpy==2.5.4", "Pillow==13.0.0"]
vision = ["torch==2.15.0", "torchvision==0.29.2", "numpy==2.5.4", "Pillow==13.0.0", "scikit-learn==1.9.1"]
tracking = ["wandb==0.31.0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
defectlab = "defectlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
