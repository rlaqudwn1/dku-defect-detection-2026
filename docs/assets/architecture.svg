<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc">
<title id="title">DefectLab 현재 구현 아키텍처</title>
<desc id="desc">진행자가 도메인 자문과 독립 검토로 결정하고 로컬 CLI를 실행한다. 데이터 검사와 분할에서 학습, 평가와 추론, 재현과 선택으로 이어진다. 실행 근거는 별도 장부와 보고서 문맥에 연결한다. W&amp;B는 선택 연결이며 원격 복구와 GPU는 미검증이다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#66788e"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;fill:#172e46}.title{font-size:27px;font-weight:700}.section{font-size:18px;font-weight:700}.label{font-size:17px;font-weight:700}.body{font-size:14px;fill:#435a70}.mono{font-family:monospace;font-size:14px;fill:#365d82}.line{fill:none;stroke:#66788e;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="980" rx="20" fill="#f3f6fa"/>
<text x="36" y="48" class="title">DefectLab · 현재 구현 아키텍처</text>
<text x="36" y="76" class="body">로컬 우선 Python 실행기 / 이미지당 anomaly_score 하나 / 0=정상 · 1=불량</text>

<rect x="36" y="104" width="1048" height="112" rx="12" fill="#e7efff" stroke="#c8d5e2"/>
<text x="54" y="134" class="label">01  판단 · 호스트에서 실제 수행</text>
<text x="54" y="160" class="body">진행자 → 필요한 도메인 자문 → 별도 독립 검토 → 결정 → 허용된 CLI 실행</text>
<text x="54" y="183" class="body">7개 관점: 연구 설계 · 데이터 · 코드/재현 · 모델링 · 평가 · 연구 운영 · 보고서</text>
<path d="M560 216V250" class="line"/>
<text x="36" y="252" class="section">02  실행 · defectlab CLI</text>
<rect x="36" y="274" width="244" height="140" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="54" y="304" class="label">원본 검사 · 분할</text>
<text x="54" y="330" class="body">verify → profile → split</text>
<text x="54" y="353" class="body">CSV · 파일 해시 · 픽셀 통계</text>
<text x="54" y="376" class="body">중복/확정 그룹 기반 분할</text>
<text x="54" y="399" class="body">data.py</text>
<rect x="310" y="274" width="244" height="140" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="328" y="304" class="label">학습 · 재개</text>
<text x="328" y="330" class="body">train / tune</text>
<text x="328" y="353" class="body">ResNet18 · BCE · 1 logit</text>
<text x="328" y="376" class="body">best.pt / last.pt</text>
<text x="328" y="399" class="body">engine.py</text>
<rect x="584" y="274" width="244" height="140" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="602" y="304" class="label">검증 · 테스트 추론</text>
<text x="602" y="330" class="body">evaluate / predict</text>
<text x="602" y="353" class="body">공유 전처리 → sigmoid 1회</text>
<text x="602" y="376" class="body">전체 검증 AUROC / CSV</text>
<text x="602" y="399" class="body">engine.py</text>
<rect x="858" y="274" width="226" height="140" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="876" y="304" class="label">결합 · 재현 · 선택</text>
<text x="876" y="330" class="body">ensemble / reproduce</text>
<text x="876" y="353" class="body">select: 최종 선택 근거</text>
<text x="876" y="376" class="body">ID·출처·분할·전처리 확인</text>
<text x="876" y="399" class="body">engine.py / selection.py</text>
<path d="M280 344H310" class="line"/>
<path d="M554 344H584" class="line"/>
<path d="M828 344H858" class="line"/>
<rect x="36" y="440" width="1048" height="78" rx="12" fill="#edf7f3" stroke="#c8d5e2"/>
<text x="54" y="470" class="label">모델 내부 경로</text>
<text x="54" y="496" class="body">EXIF 보정 → RGB → 비율 유지 resize + 중앙 pad → 정규화 → ResNet18 → 1 logit → sigmoid → anomaly_score</text>
<path d="M560 518V558" class="line"/>
<text x="36" y="554" class="section">03  근거 · 실행 결과와 판단을 별도로 연결</text>
<rect x="36" y="576" width="324" height="132" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="54" y="606" class="label">로컬 실행 산출물</text>
<text x="54" y="632" class="body">설정 · split · 코드/환경 식별</text>
<text x="54" y="655" class="body">가중치 · 예측 · run.json</text>
<text x="54" y="678" class="body">events.jsonl / tracking.py</text>
<rect x="394" y="576" width="324" height="132" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="412" y="606" class="label">비공개 관리 장부</text>
<text x="412" y="632" class="body">record / status / workflow</text>
<text x="412" y="655" class="body">요청·실행·검토·결정·단계 분리</text>
<text x="412" y="678" class="body">governance.py / workflow.py</text>
<rect x="752" y="576" width="332" height="132" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="770" y="606" class="label">보고서 근거 묶음</text>
<text x="770" y="632" class="body">results / context</text>
<text x="770" y="655" class="body">freshness → freeze</text>
<text x="770" y="678" class="body">파일 해시 · 주장 · 한계 · 의존성</text>
<path d="M360 642H394" class="line"/>
<path d="M718 642H752" class="line"/>
<text x="36" y="742" class="section">04  저장 · 외부 연결 경계</text>
<rect x="36" y="764" width="324" height="114" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="54" y="794" class="label">Git: 공개 가능한 자료</text>
<text x="54" y="820" class="body">코드 · 설정 · 문서 · 테스트</text>
<text x="54" y="843" class="body">원본·가중치·예측·키는 제외</text>
<rect x="394" y="764" width="324" height="114" rx="12" fill="#ffffff" stroke="#c8d5e2"/>
<text x="412" y="794" class="label">개인 영속 저장소</text>
<text x="412" y="820" class="body">장부 · 원본 · 실행/복구 자료</text>
<text x="412" y="843" class="body">복사 → 목적지 해시 → 복구 확인</text>
<rect x="752" y="764" width="332" height="114" rx="12" fill="#fff6e5" stroke="#e4c88e"/>
<text x="770" y="794" class="label">W&amp;B: 선택 연결</text>
<text x="770" y="820" class="body">기본 disabled / offline 로컬 검증</text>
<text x="770" y="843" class="body">online · 원격 Artifact는 미검증</text>
<path d="M198 708V764" class="line" stroke-dasharray="6 5"/>
<path d="M556 708V764" class="line" stroke-dasharray="6 5"/>
<path d="M1000 708V764" class="line" stroke-dasharray="6 5"/>
<text x="36" y="915" class="body">실선: 실행/근거 흐름 · 점선: 저장/연결 경계(직접 의존 모듈 그래프가 아님)</text>
<text x="36" y="940" class="body">검증 범위: 합성 CPU 기능 경로 · W&amp;B offline / 미검증: 실제 대회 성능 · Colab GPU · 원격 복구</text>
<text x="36" y="964" class="body">관리 명령은 전문가를 호출하지 않음 · packets.py는 오프라인 패킷 준비만 수행 · 제출/결제는 별도 지시</text>
</svg>
