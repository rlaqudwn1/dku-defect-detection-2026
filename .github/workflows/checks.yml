name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[data,vision,tracking,dev]'
      - run: python scripts/check_text.py
      - run: ruff check .
      - run: pytest
